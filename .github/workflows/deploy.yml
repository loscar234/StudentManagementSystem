name: Build, Test & Live Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package Executable JAR
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secure_password_2026
          MYSQL_DATABASE: student_management_system
          MYSQL_USER: sms_user
          MYSQL_PASSWORD: sms_app_password_2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install MySQL Client & Wait for MySQL Service
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          while ! mysqladmin ping -h 127.0.0.1 -u sms_user -psms_app_password_2026 --silent; do
            echo "Waiting for MySQL service..."
            sleep 2
          done

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -u sms_user -psms_app_password_2026 student_management_system < sql/schema.sql
          echo "Database schema initialized successfully."

      - name: Build Executable Standalone JAR
        run: |
          chmod +x build-jar.sh
          ./build-jar.sh

      - name: Run Automated Governance & Policy Integration Tests
        run: |
          export SMS_DB_HOST=127.0.0.1
          export SMS_DB_PORT=3306
          export SMS_DB_NAME=student_management_system
          export SMS_DB_USER=sms_user
          export SMS_DB_PASSWORD=sms_app_password_2026
          java -cp "dist/StudentManagementSystem.jar" util.Phase2GovernanceTest

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentManagementSystem-Executable-JAR
          path: dist/StudentManagementSystem.jar
          if-no-files-found: error

  docker-build:
    name: Build Live Web Container
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          labels: ${{ steps.meta.outputs.labels }}
